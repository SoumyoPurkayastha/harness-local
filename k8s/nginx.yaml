apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipe37365-nginx
  labels:
    app: pipe37365
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipe37365
  template:
    metadata:
      labels:
        app: pipe37365
      annotations:
        pipe37365/execution: <+pipeline.executionId>
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - sleep 90; exec nginx -g 'daemon off;'
