template:
  inputs:
    fail: { type: string }
  pipeline:
    stages:
      - id: s1
        runtime: shell
        steps:
          - id: print
            run: { script: echo "PIPE=feature FAIL=<+inputs.fail>" }
          - id: maybe_fail
            run: { script: 'if [ "<+inputs.fail>" = "yes" ]; then exit 1; fi' }
spec: { type: pipeline }
